[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
name = "bluesky-web-plots"
description = "Dash + plotly bluesky plotting sevice/callback."
dependencies = [
  "uv",
  "plotly[express]",
  "pyzmq",
  "event-model",
  "dash",
  "dash_bootstrap_components",
  "attrs"
]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
GitHub = "https://github.com/evvaaaa"

[[project.authors]]
email = "eva.lott@helmholtz-berlin.de"
name = "Eva Lott"
email = "brian.pauw@bam.de"
name = "Brian Richard Pauw"

[project.optional-dependencies]
local = ["PyQt5", "PyQtWebEngine"]
dev = ["ruff", "pyright", "bluesky", "ophyd_async", "pytest-asyncio", "pytest"]

[tool.setuptools_scm]
version_file = "src/bluesky_web_plots/_version.py"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]